<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Details</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      /* Global Styles */
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f0f0f0;
        font-family: "Poppins", sans-serif;
        scroll-behavior: smooth;
      }
      body::-webkit-scrollbar{
        display: none;
      }

      /* Home Page Section */
      #HomePageSection {
        position: relative;
        width: 100%;
        height: auto; /* Allow height to adjust automatically */
        text-align: center; /* Center content */
      }

      #logoImage {
        margin-top: 2px; /* Adjust position */
        width: 60px; /* Adjust logo size */
        height: auto;
        z-index: 10;
      }

      /* Slogan Styles */
      #slogan {
        margin-top: 10px; /* Adjust position */
        font-size: 20px; /* Adjust font size */
        color: #333;
        z-index: 10;
        font-weight: 600;
      }

      /* Home Symbol Styles */
      #homeSymbol {
        position: absolute;
        top: 20px;
        left: 20px; /* Position the home button */
        z-index: 10;
      }

      #homeSymbol a {
        text-decoration: none;
        color: #333;
        font-size: 25px;
      }

      #homeSymbol a:hover {
        color: #555;
      }

      .main-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        height: auto; /* Allow height to adjust automatically */
        background-color: lavender;
        padding: 10px; /* Add padding for better spacing */
      }

      .container {
        display: flex;
        flex-direction: column;
        width: 100%;
        justify-content: space-between;
      }

      .form-container {
        width: 100%; /* Use full width */
        padding: 12px;
        border: 2px solid #ccc;
        border-radius: 10px;
        margin: 20px auto; /* Center the form */
        background-color: #f9f9f9;
        height: auto; /* Allow height to adjust */
      }

      .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
      }

      .form-group {
        flex: 1;
        min-width: 220px;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
      }

      .form-group label {
        flex: 0 0 150px;
        font-weight: bold;
        color: #333;
        font-size: 14px;
        margin-right: 10px;
      }

      .form-group input,
      .form-group select {
        padding: 8.5px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
        width: 70%; /* Set width for inputs */
      }

      .buttons {
        display: flex;
        justify-content: flex-end; /* Align buttons to the right */
        gap: 15px;
        margin-left: 5px;
        margin-right: 5px;
      }

      button {
        padding: 14px 27px;
        border: none;
        border-radius: 4px;
        background-color: #337ab7;
        color: white;
        cursor: pointer;
      }

      #cancel {
        background-color: #ff5e57;
      }

      .table-container {
        height: 30vh; /* Allow height to adjust */
        width: 100%;
        overflow: auto;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: white;
       
      }
      .table-container::-webkit-scrollbar{
        display: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #ccc;
        text-align: left;
        padding: 15px;
      }

      table th {
        background-color: #555555;
        color: #fff;
      }

      table tr:hover {
        background-color: #555555;
        color: white;
      }
      thead {
            background-color: #f2f2f2;
            position: sticky;
            top: -4px;
            bottom: 0;
            z-index: 1;
        }

      /* Responsive styles */
      @media (max-width: 768px) {
        .header {
          flex-direction: column; /* Stack items vertically */
          align-items: center;
          height: auto; /* Adjust height */
        }

        .form-group {
          flex: 1 1 100%; /* Make form groups take full width */
        }

        .buttons {
          flex-direction: column; /* Stack buttons vertically */
          align-items: flex-end; /* Align buttons to the right */
        }

        .form-container {
          margin: 10px; /* Reduce margins */
        }

        .table-container {
          margin: 10px; /* Reduce margins */
          overflow: auto; /* Keep overflow for small screens */
        }
      }

      @media (max-width: 480px) {
        #logoImage {
          width: 40px; /* Smaller logo on very small screens */
        }

        #slogan {
          font-size: 16px; /* Adjust font size further */
        }

        .form-group label {
          flex: 0 0 100px; /* Adjust label width */
        }

        .form-group input,
        .form-group select {
          width: 90%; /* Wider inputs on small screens */
        }
      }
      @media (min-width: 325px) and (max-width: 767px) {
        .form-group label {
          font-size: 12px;
        }
        .buttons {
          flex-direction: row;
          align-items: flex-end;
          justify-content: center;
          padding-top: 30px;
          font-size: xx-small;
        }
        #homeSymbol {
          position: relative;
        }
        #cancel {
          font-size: 14px;
          padding: 7px 13px;
        }
        body{
            overflow: scroll;
        }
      }
    </style>
  </head>

  <body>
    <div id="homeSymbol">
      <a href="ceiling.html#HomePageSection" title="Go to Home">
        <i class="fas fa-home"></i>
      </a>
    </div>

    <section id="HomePageSection">
      <img
        id="logoImage"
        src="logo.sr1-removebg-preview.png"
        alt="Logo Image"
      />
      <div id="slogan">Works & Sales</div>

      <div class="container">
        <div class="form-container">
          <form id="stock-charges">
            <div class="form-row">
              <div class="form-group">
                <label for="stock-id">Stock Id</label>
                <input
                  type="number"
                  id="stock-id"
                  name="stock-id"
                  class="input"
                  required
                />
              </div>
              <div class="form-group">
                <label for="item-name">Item Name</label>
                <input
                  type="text"
                  id="item-name"
                  name="item-name"
                  class="input"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>
                <input
                  type="text"
                  id="category"
                  name="category"
                  class="input"
                  required
                />
              </div>
              <div class="form-group">
                <label for="quantity">Quantity</label>
                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  class="input"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="supplier-name">Supplier Name</label>
                <input
                  type="text"
                  id="supplier-name"
                  name="supplier-name"
                  class="input"
                  required
                />
              </div>
              <div class="form-group">
                <label for="supplier-contact">Supplier Contact</label>
                <input
                  type="number"
                  id="supplier-contact"
                  name="supplier-contact"
                  class="input"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="purchase-price">Purchase Price</label>
                <input
                  type="number"
                  id="purchase-price"
                  name="purchase-price"
                  class="input"
                  required
                />
              </div>
              <div class="form-group">
                <label for="date-received">Date Received</label>
                <input
                  type="date"
                  id="date-received"
                  name="date-received"
                  class="input"
                  required
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="sales-price">Sales Price</label>
                <input
                  type="number"
                  id="sales-price"
                  name="sales-price"
                  class="input"
                  required
                />
              </div>
              <div class="form-group">
                <label for="expiry-time">Time</label>
                <input
                  type="time"
                  id="expiry-time"
                  name="expiry-time"
                  class="input"
                  required
                />
              </div>
            </div>
            <div class="buttons">
              <button
                type="button"
                onclick="submitForm(event)"
                class="btn btn-primary"
              >
                Submit
              </button>
              <button type="button" id="cancel">Cancel</button>
            </div>
          </form>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Stock ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Supplier Name</th>
                <th>Supplier Contact</th>
                <th>Purchase Price</th>
                <th>Date Received</th>
                <th>Sales Price</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="c">
              <!-- Table data goes here -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#cancel").click(function () {
          // Clear form fields on cancel
          $("#stock-charges")[0].reset();
        });
      });

      $(document).ready(function () {
        fetchall();
      });

      function fetchall() {
        const payload = { load: "fetch" };
        $.ajax({
          url: "stockdetails.php",
          type: "POST",
          dataType: "json",
          data: JSON.stringify(payload),
          success: function (response) {
            const chargesTableBody = $("#c");
            chargesTableBody.empty();
            response.data.forEach((item) => {
              const row = $("<tr>");
              row.html(`
                        <td>${item.stockid}</td>
                        <td>${item.itemname}</td>
                        <td>${item.category}</td>
                        <td>${item.quantity}</td>
                        <td>${item.suppliername}</td>
                        <td>${item.suppliercontact}</td>
                        <td>${item.purchaseprice}</td>
                         <td>${item.datereceived}</td>
                         <td>${item.salesprice}</td>
                        <td>${item.time}</td>
                        
                    `);
              chargesTableBody.append(row);
            });
          },
          error: function (error) {
            console.error("Error fetching data:", error);
          },
        });
      }
      function submitForm(event) {
        event.preventDefault(); // Prevent default form submission behavior

        // Get form values
        const stock = $("#stock-id").val();
        const item = $("#item-name").val();
        const category = $("#category").val();
        const quantity = $("#quantity").val();
        const name = $("#supplier-name").val();
        const number = $("#supplier-contact").val();
        const sp = $("#purchase-price").val();
        const date = $("#date-received").val();
        const sales = $("#sales-price").val();
        const time = $("#expiry-time").val(); // Corrected ID

        // Create payload object
        const payload = {
          stock: stock,
          item: item,
          category: category,
          quantity: quantity,
          name: name,
          number: number,
          sp: sp,
          date: date,
          sales: sales,
          time: time,
          load: "submit", // Custom load parameter for the backend
        };

        console.log(payload); // Log the payload for debugging

        // AJAX request to submit form data
        $.ajax({
          type: "POST",
          url: "stockdetails.php", // Corrected URL
          data: JSON.stringify(payload),
          contentType: "application/json",
          success: function (response) {
            alert("Stock details submitted successfully!");
            $("#stock-charges")[0].reset(); // Clear the form after successful submission
            fetchall(); // Reload the table to display updated data
          },
          error: function (error) {
            console.error(error);
          },
        });
      }
    </script>
  </body>
</html>
