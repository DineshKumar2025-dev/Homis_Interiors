<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        /* Global Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #f0f0f0;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        /* Home Page Section */
        #HomePageSection {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #logoImage {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: auto;
            z-index: 10;
        }

        /* Slogan Styles */
        #slogan {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: #333;
            z-index: 10;
            font-weight: 600;
        }
        /* Home Symbol Styles */
        #homeSymbol {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        #homeSymbol a {
            text-decoration: none;
            color: #333;
            font-size: 25px;
        }

        #homeSymbol a:hover {
            color: #555;
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-container {
            flex: 1;
            max-width: 50%;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-right: 20px;
        }

        h2 {
            text-align: left;
            margin-bottom: 20px;
            color: #337ab7;
            font-weight: bold;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
        }

        .btn-primary {
            background-color: #337ab7;
            border-color: #337ab7;
            border-radius: 5px;
            font-size: 16px;
            padding: 10px 20px;
        }

        .btn-primary:hover {
            background-color: #286090;
            border-color: #204d74;
        }

        .btn-cancel {
            background-color: #b0b0b0;
            border-color: #a0a0a0;
            border-radius: 5px;
            font-size: 16px;
            padding: 10px 20px;
            margin-left: 10px;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #909090;
            border-color: #808080;
            color: white;
        }

        .btn-group {
            display: flex;
            justify-content: flex-start;
            margin-top: 20px;
            gap: 20px;
        }

        .image-container {
            flex: 1;
            max-width: 50%;
            margin-left: 30px;
            height: 500px;
            border-radius: 8px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .form-row {
                flex-direction: column;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-cancel {
                margin-left: 0;
                margin-top: 10px;
            }
        }

        .required {
            color: red;
            font-weight: bold;
        }

        /* Receipt styles */
        #receipt {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #receipt h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .receipt-details {
            margin-bottom: 10px;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #receipt, #receipt * {
                visibility: visible;
            }

            #receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
        @media (min-width:325px) and (max-width:767px){
            .main-container{
                align-items: unset;
            }
            .form-container{
                margin: 0;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="homeSymbol">
        <a href="ceiling.html#HomePageSection" title="Go to Home">
            <i class="fas fa-home"></i>
        </a>
    </div>

    <section id="HomePageSection">
        <img id="logoImage" src="logo.sr1-removebg-preview.png" alt="Logo Image">
        <div id="slogan">Works & Sales</div>

        <div class="main-container">
            <!-- Left side form -->
            <div class="form-container">
                <h2>Generate Receipt</h2>
                <form onsubmit="submitForm(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer-name">Customer Name<span class="required"> *</span></label>
                            <input type="text" id="customer-name" class="form-control" placeholder="Enter Customer Name" required>
                        </div>
                        <div class="form-group">
                            <label for="contact">Contact<span class="required"> *</span></label>
                            <input maxlength="10" type="number" id="contact" class="form-control" placeholder="Enter Contact Number" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="bill-number">Bill Number<span class="required"> *</span></label>
                            <input maxlength="10" type="number" id="bill-number" class="form-control" placeholder="Enter Bill Number" required>
                        </div>
                        <div class="form-group">
                            <label for="date-time">Date and Time<span class="required"> *</span></label>
                            <input type="datetime-local" id="date-time" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="item-description">Item Description<span class="required"> *</span></label>
                            <input type="text" id="item-description" class="form-control" placeholder="Enter Item Description" required>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Quantity<span class="required"> *</span></label>
                            <input type="number" id="quantity" class="form-control" placeholder="Enter Quantity" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="unit-price">Unit Price<span class="required"> *</span></label>
                            <input type="number" id="unit-price" class="form-control" placeholder="Enter Unit Price" required>
                        </div>
                        <div class="form-group">
                            <label for="total-price">Total Price<span class="required"> *</span></label>
                            <input type="number" id="total-price" class="form-control" placeholder="Enter Total Price" required>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">Generate</button>
                        <button type="button" class="btn btn-cancel" onclick="cancelForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Right side image -->
            <div class="image-container">
                <img src="path-to-your-image.jpg" alt="Image">
            </div>
        </div>

        <!-- Receipt Section -->
        <div id="receipt">
            <h3>Receipt</h3>
            <div class="receipt-details">Customer Name: <span id="receipt-customer-name"></span></div>
            <div class="receipt-details">Contact: <span id="receipt-contact"></span></div>
            <div class="receipt-details">Bill Number: <span id="receipt-bill-number"></span></div>
            <div class="receipt-details">Date and Time: <span id="receipt-date-time"></span></div>
            <div class="receipt-details">Item Description: <span id="receipt-item-description"></span></div>
            <div class="receipt-details">Quantity: <span id="receipt-quantity"></span></div>
            <div class="receipt-details">Unit Price: <span id="receipt-unit-price"></span></div>
            <div class="receipt-details">Total Price: <span id="receipt-total-price"></span></div>
        </div>

    </section>

    <script>
        function submitForm(event) {
            event.preventDefault();

            // Get form values
            var customerName = document.getElementById('customer-name').value;
            var contact = document.getElementById('contact').value;
            var billNumber = document.getElementById('bill-number').value;
            var dateTime = document.getElementById('date-time').value;
            var itemDescription = document.getElementById('item-description').value;
            var quantity = document.getElementById('quantity').value;
            var unitPrice = document.getElementById('unit-price').value;
            var totalPrice = document.getElementById('total-price').value;

            // Display values in receipt section
            document.getElementById('receipt-customer-name').textContent = customerName;
            document.getElementById('receipt-contact').textContent = contact;
            document.getElementById('receipt-bill-number').textContent = billNumber;
            document.getElementById('receipt-date-time').textContent = dateTime;
            document.getElementById('receipt-item-description').textContent = itemDescription;
            document.getElementById('receipt-quantity').textContent = quantity;
            document.getElementById('receipt-unit-price').textContent = unitPrice;
            document.getElementById('receipt-total-price').textContent = totalPrice;

            // Show receipt and trigger print
            document.getElementById('receipt').style.display = 'block';
            window.print();
            submit(event)
            
        }

        function cancelForm() {
            document.querySelector('form').reset();
            document.getElementById('receipt').style.display = 'none';
        }
        function submit(event) {
    event.preventDefault(); // Prevent default form submission behavior

    // Get form values
    const bill = $('#bill-number').val();
    const date = $('#date-time').val();
    const Description = $('#item-description').val();
    const quantity = $('#quantity').val();
    const name = $('#customer-name').val();
    const number = $('#contact').val();
    const unit=$('#unit-price').val();
    const totalprice=$('#total-price').val();

   
  
    

    // Create payload object
    const payload = {
        bill:bill,
        date:date,
        description:Description,
        quantity:quantity,
        name:name,
        number:number,
        unit:unit,
        totalprice:totalprice,
        load: 'bill' // Custom load parameter for the backend
    };

    console.log(payload); // Log the payload for debugging

    // AJAX request to submit form data
    $.ajax({
        type: 'POST',
        url: 'stockdetails.php', // Corrected URL
        data: JSON.stringify(payload),
        contentType: 'application/json',
        success: function(response) {
         
            $('#form')[0].reset(); // Clear the form after successful submission
          // Reload the table to display updated data
        },
        error: function(error) {
            console.error(error);
            
        }
    });
}



    </script>
</body>

</html>
